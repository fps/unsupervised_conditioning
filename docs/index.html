<!DOCTYPE html>
<html>
<head>
</head>
<body>
  <audio preload="auto" loop="true" src="Take1_Audio 1-1_short.wav" id="input"></audio>

  <input type="button" value="start" onclick="setup()">
  <br>
  <input type="range" min="0" max="1" step="0.001" value="0.001" id="input_gain"> input gain
  <br>
  <input type="range" min="-1" max="1" step="0.01" id="bass"> bass
  <br>
  <input type="range" min="-1" max="1" step="0.01" id="mid"> mid
  <br>
  <input type="range" min="-1" max="1" step="0.01" id="treble"> treble
  <br>
  <input type="range" min="0" max="1" step="0.001" value="0.001"  id="output_gain"> output gain
  
  <script src="web.js"></script>
  <script>
    a = new Float32Array(1024);
    
    for (i = 0; i < 1024; ++i) {
        a[i] = i;
    }

    var audioContext = null;
       
    function setup() {
        console.log("setup()");
        if (audioContext != null) {
            console.log("already initialized..");
            return;
        }

        console.log("prepare_net()");
        Module.prepare_net();
        
        audioContext = new AudioContext();
        const input_audio = document.getElementById("input");
        const element_source = audioContext.createMediaElementSource(input_audio);

        var script_node = audioContext.createScriptProcessor(4096, 1, 1);

        script_node.addEventListener("audioprocess", (e) => {
            const bass = document.getElementById("bass").value;
            const mid = document.getElementById("mid").value;
            const treble = document.getElementById("treble").value;
            const input_gain = document.getElementById("input_gain").value;
            const output_gain = document.getElementById("output_gain").value;

            // console.log("bass: " + bass + " mid: " + mid + " treble: " + treble);
            
            for (i = 0; i < 4096 / 1024; ++i) {
                for (j = 0; j < 1024; ++j) {
                    a[j] = input_gain * e.inputBuffer.getChannelData(0)[i * 1024 + j];
                }
                    
                var output = Module.process_net(a, bass, mid, treble);
                // console.log(output[0]);

                for (j = 0; j < 1024; ++j) {
                    e.outputBuffer.getChannelData(0)[i * 1024 + j] = output_gain * output[j];
                    // e.outputBuffer.getChannelData(0)[i * 1024 + j] = gain * e.inputBuffer.getChannelData(0)[i * 1024 + j];
                }
            }
        });

        element_source.connect(script_node);
        script_node.connect(audioContext.destination);
        // element_source.start();

        input_audio.play();
    }
  </script>
</body>
</html>
