<!DOCTYPE html>
<html>
<head>
</head>
<body>
  <audio preload="auto" loop="true" src="Take1_Audio 1-1_short.wav" id="input"></audio>
  <input type="button" value="start" onclick="setup()">
  <br>
  <input type="range" min="-1" max="1" step="0.01" id="bass"> bass
  <br>
  <input type="range" min="-1" max="1" step="0.01" id="mid"> mid
  <br>
  <input type="range" min="-1" max="1" step="0.01" id="treble"> treble
  
  <script src="web.js"></script>
  <script>
    a = new Float32Array(1024 * 4);
    
    for (i = 0; i < 1024 * 4; ++i) {
        a[i] = i;
    }

    var audioContext = null;
    var gain = 1.0;
   
    function setup() {
        console.log("setup()");
        if (audioContext != null) {
            console.log("already initialized..");
            return;
        }
        
        audioContext = new AudioContext();
        const input_audio = document.getElementById("input");
        const element_source = audioContext.createMediaElementSource(input_audio);

        var script_node = audioContext.createScriptProcessor(4096, 1, 1);

        script_node.addEventListener("audioprocess", (e) => {
            // console.log("tat");
            // console.log(e.inputBuffer.getChannelData(0)[0]);
            /*
            for (i = 0; i < 4096; ++i)
            {
                e.outputBuffer.getChannelData(0)[i] = Math.tanh(10 * e.inputBuffer.getChannelData(0)[i]);
                }
            */

            for (i = 0; i < 4096 / 1024; ++i) {
                for (j = 0; j < 1024; ++j) {
                    a[j] = e.inputBuffer.getChannelData(0)[i * 1024 + j];
                    a[j] = e.inputBuffer.getChannelData(0)[i * 1024 + j];
                    a[j] = e.inputBuffer.getChannelData(0)[i * 1024 + j];
                    a[j] = e.inputBuffer.getChannelData(0)[i * 1024 + j];
                }
                    
                const output = Module.process_net(a);

                for (j = 0; j < 1024; ++j) {
                    // e.outputBuffer.getChannelData(0)[i * 1024 + j] = gain * output[j];
                    e.outputBuffer.getChannelData(0)[i * 1024 + j] = gain * e.inputBuffer.getChannelData(0)[i * 1024 + j];
                }
            }
        });

        element_source.connect(script_node);
        script_node.connect(audioContext.destination);
        // element_source.start();

        input_audio.play();
    }
  </script>
</body>
</html>
